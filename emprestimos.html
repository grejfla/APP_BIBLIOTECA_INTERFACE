<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Empréstimos - Sistema Bibliotecário</title>
  <link rel="stylesheet" href="style_emprestimos.css">
</head>
<body>
  <header><h1>Sistema Bibliotecário</h1></header>
  <main>
    
<main>
  <form id="formEmprestimo" class="formulario">
    <div class="container">
      <h2>Registro de Empréstimo</h2>

      <label for="tipoUsuario">Tipo de usuário:</label>
      <select id="tipoUsuario" required>
        <option value="">Selecione</option>
        <option value="funcionario">Funcionário</option>
        <option value="aluno">Aluno</option>
      </select>

      <label for="pesquisaUsuario">Pesquisar usuário:</label>
      <input
        type="search"
        id="pesquisaUsuario"
        placeholder="Digite o nome do usuário"
        disabled
      >

      <label for="usuarioSelecionado">Usuário:</label>
      <select id="usuarioSelecionado" required disabled>
        <option value="">Selecione o usuário</option>
      </select>

      <label for="pesquisaLivro">Pesquisar livro:</label>
      <input
        type="search"
        id="pesquisaLivro"
        placeholder="Título, autor, editora, ISBN ou categoria"
      >

      <label for="livroSelecionado">Livro:</label>
      <select id="livroSelecionado" required>
        <option value="">Carregando livros...</option>
      </select>

      <label for="dataEmprestimo">Data do empréstimo:</label>
      <input type="date" id="dataEmprestimo" required>

      <label for="previsaoDevolucao">Previsão de devolução:</label>
      <input type="date" id="previsaoDevolucao" required>

      <p id="mensagemEmprestimo" role="status"></p>

      <div class="acoes">
        <button type="submit">Registrar empréstimo</button>
      </div>
    </div>
  </form>
</main>

</body>
</html>
