<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de Livro - Sistema Bibliotecário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Sistema Bibliotecário</h1></header>
  <main>
    <form class="formulario" action="#" method="post">
      <h2>Cadastro Livro</h2>
      <label for="titulo">Título:</label>
      <input type="text" id="titulo" name="titulo" required>
      <label for="autor">Autor:</label>
      <input type="text" id="autor" name="autor" required>
      <label for="editora">Editora:</label>
      <select id="editora" name="editora" required><option value="">-- Escolha uma opção --</option></select>
      <label for="isbn">ISBN:</label>
      <input type="text" id="isbn" name="isbn">
      <div class="acoes"><button type="submit">Salvar</button><button type="reset">Limpar</button></div>
    </form>
  </main>

    <ul>

      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="sair.html">Sair</a></li>
    </ul>
  </nav>

    <a href="editoras.html"><span class="icone">📚</span>Editoras</a>
    <a href="livros.html"><span class="icone">📕</span>Livros</a>
    <a href="usuarios.html"><span class="icone">👤</span>Usuários</a>
  </section>
</body>
</html>
