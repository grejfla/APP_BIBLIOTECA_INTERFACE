
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultas - Sistema Bibliotecário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sistema Bibliotecário</h1>
  </header>

  <main>
    <div class="conteudo">
      <h2>Consultas</h2>

      <form id="formConsulta">
        <select id="tipoConsulta" name="tipo" required>
          <option value="livros">Livros</option>
          <option value="usuarios">Usuários</option>
          <option value="emprestimos">Empréstimos</option>
        </select>

        <input
          type="search"
          id="campoBusca"
          name="busca"
          placeholder="Digite sua busca"
        >

        <button type="submit">Buscar</button>
      </form>

      <p id="mensagemConsulta" role="status"></p>

      <table>
        <thead>
          <tr>
            <th>Código</th>
            <th>Descrição</th>
          </tr>
        </thead>

        <tbody id="resultadoConsulta">
          <tr>
            <td colspan="2">Digite sua busca ou clique em Buscar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <nav>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="cadastros.html">Cadastros</a></li>
      <li><a href="emprestimos.html">Empréstimos</a></li>
      <li><a href="consultas.html" class="ativo">Consultas</a></li>
      <li><a href="relatorios.html">Relatórios</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="index.html">Sair</a></li>
    </ul>
  </nav>

  <script src="scripts/consultas.js"></script>
</body>
</html>
