<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relatórios - Sistema Bibliotecário</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><h1>Sistema Bibliotecário</h1></header>

  <main>
    <div class="conteudo">
      <h2>Relatórios</h2>

      <form id="formRelatorio">
        <select id="tipoRelatorio" name="relatorio">
          <option value="abertos">Empréstimos em aberto</option>
          <option value="livros">Livros cadastrados</option>
          <option value="usuarios">Usuários cadastrados</option>
        </select>
        <button type="submit">Gerar relatório</button>
        <button type="button" id="btnImprimir" hidden>Imprimir</button>
      </form>

      <p id="mensagemRelatorio" role="status"></p>

      <section id="areaRelatorio" hidden>
        <h3 id="tituloRelatorio"></h3>
        <p id="resumoRelatorio"></p>
        <table>
          <thead id="cabecalhoRelatorio"></thead>
          <tbody id="corpoRelatorio"></tbody>
        </table>
      </section>
    </div>
  </main>

  <nav>
    <ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="cadastros.html">Cadastros</a></li>
      <li><a href="emprestimos.html">Empréstimos</a></li>
      <li><a href="consultas.html">Consultas</a></li>
      <li><a href="relatorios.html" class="ativo">Relatórios</a></li>
      <li><a href="sobre.html">Sobre</a></li>
      <li><a href="index.html">Sair</a></li>
    </ul>
  </nav>

  <script src="scripts/relatorios.js"></script>
</body>
</html>
